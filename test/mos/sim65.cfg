# linker config for sim65 QBE tests
MEMORY {
    ZP:   file = "",  start = $0002, size = $00EE,
          type = rw, define = yes;
    HEAD: file = %O,  start = $0000, size = $000C;
    MAIN: file = %O,  start = $0200, size = $FD00,
          define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    EXEHDR:   load = HEAD, type = ro;
    STARTUP:  load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss,
              define = yes;
}

SYMBOLS {
    __RAM_START__: type = export, value = $0200;
    __RAM_SIZE__:  type = export, value = $FD00;
}
